[package]
name = "depot_downloader"
version = "0.2.2"
edition = "2024"
authors = ["ArkDra", "arkdra@qq.com"]
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
clap = { version = "4.5.59", features = ["derive"] }
crc32fast = "1.5.0"
data-encoding = "2.10.0"
ecb = "0.1.2"
flume = "0.12.0"
futures = "0.3.32"
indicatif = { version = "0.18.4" }
lzma-rust2 = { version = "0.16.2", default-features = false, features = ["std", "optimization"] }
num_cpus = "1.17.0"
parking_lot = "0.12.5"
protobuf = "3.7.2"
reqwest = { version = "0.13.2", default-features = false, features = [
    "native-tls",
] }
serde_json = "1.0.149"
sha1 = "0.10.6"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate", "deflate64"] }
zstd = "0.13.3"

[profile.release]
lto = true
debug = false
strip = true
panic = "abort"
codegen-units = 1
