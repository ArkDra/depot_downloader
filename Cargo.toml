[package]
name = "depot_downloader"
version = "0.2.0"
edition = "2024"
authors = ["ArkDra", "arkdra@qq.com"]
license = "MIT OR Apache-2.0"

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
clap = { version = "4.5.47", features = ["derive"] }
crc32fast = "1.5.0"
data-encoding = "2.9.0"
ecb = "0.1.2"
futures = "0.3.31"
indicatif = { version = "0.17.11" }
liblzma = { version = "0.4.4", features = ["parallel"] }
num_cpus = "1.17.0"
protobuf = "3.7.2"
reqwest = { version = "0.12.23", default-features = false, features = [
    "native-tls",
] }
serde_json = "1.0.145"
sha1 = "0.10.6"
thiserror = "2.0.18"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zip = "4.6.1"
zstd = "0.13.3"

[profile.release]
lto = true
debug = false
strip = true
panic = "abort"
codegen-units = 1
